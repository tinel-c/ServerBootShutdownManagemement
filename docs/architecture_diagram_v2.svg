<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <!-- Modern Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="4" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="autoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8fafc" />

  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1e293b" text-anchor="middle">
    System Architecture & Interaction Flow
  </text>

  <!-- 1. END USER -->
  <g filter="url(#shadow)">
    <rect x="450" y="100" width="300" height="100" rx="15" fill="white" stroke="#3b82f6" stroke-width="2" />
    <text x="600" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">END USER</text>
    <text x="600" y="170" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Web Dashboard Interface</text>
  </g>

  <!-- 2. HEALTHCHECKS.IO (Cloud) -->
  <g filter="url(#shadow)">
    <rect x="950" y="100" width="200" height="120" rx="20" fill="white" stroke="#2563eb" stroke-width="2" />
    <image href="https://healthchecks.io/static/img/logo.png" x="975" y="115" width="150" height="60" />
    <text x="1050" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Healthchecks.io</text>
  </g>

  <!-- 3. AUTOMATION SERVER -->
  <g filter="url(#shadow)">
    <rect x="150" y="280" width="900" height="350" rx="30" fill="url(#autoGrad)" stroke="#3b82f6" stroke-width="3" />
    <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Logo-ubuntu_cof-orange-hex.svg/200px-Logo-ubuntu_cof-orange-hex.svg.png" x="175" y="300" width="60" height="60" />
    <text x="600" y="325" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AUTOMATION SERVER (Ubuntu VM)</text>
    
    <!-- Node-RED -->
    <rect x="200" y="380" width="250" height="120" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <image href="https://nodered.org/favicon.ico" x="295" y="395" width="60" height="60" />
    <text x="325" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#991b1b" text-anchor="middle">Node-RED</text>
    
    <!-- Mosquitto -->
    <rect x="750" y="380" width="250" height="120" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <image href="https://mosquitto.org/images/mosquitto-text-side.png" x="775" y="395" width="200" height="60" />
    <text x="875" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Mosquitto MQTT</text>
    
    <!-- Python Scripts -->
    <rect x="400" y="520" width="400" height="90" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
    <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Python-logo-notext.svg/200px-Python-logo-notext.svg.png" x="420" y="535" width="60" height="60" />
    <text x="620" y="575" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#581c87" text-anchor="middle">Python Management Scripts</text>
  </g>

  <!-- 4. MANAGED SERVERS -->
  <!-- Dell -->
  <g filter="url(#shadow)">
    <rect x="150" y="700" width="425" height="150" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3" />
    <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Dell_logo_2016.svg/200px-Dell_logo_2016.svg.png" x="175" y="725" width="100" height="100" />
    <text x="400" y="750" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Dell PowerEdge T310</text>
    <text x="400" y="775" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">(Proxmox Host)</text>
    <image href="https://www.proxmox.com/images/proxmox/proxmox-logo-color-stacked.png" x="340" y="790" width="120" height="45" />
  </g>

  <!-- HP -->
  <g filter="url(#shadow)">
    <rect x="625" y="700" width="425" height="150" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3" />
    <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/HP_logo_2012.svg/200px-HP_logo_2012.svg.png" x="650" y="725" width="100" height="100" />
    <text x="875" y="750" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7c2d12" text-anchor="middle">HP ProLiant DL360p</text>
    <text x="875" y="775" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">(Proxmox Host)</text>
    <image href="https://www.proxmox.com/images/proxmox/proxmox-logo-color-stacked.png" x="815" y="790" width="120" height="45" />
  </g>

  <!-- ARROWS & INTERACTIONS -->
  <g stroke-linecap="round">
    <!-- User -> Node-RED -->
    <path d="M 500 200 L 350 380" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)" />
    <text x="400" y="260" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6" font-weight="bold">Web/HTTP</text>

    <!-- Node-RED <-> Mosquitto -->
    <path d="M 450 420 L 750 420" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)" />
    <path d="M 750 460 L 450 460" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)" />
    <text x="600" y="445" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6" font-weight="bold" text-anchor="middle">MQTT Commands/Status</text>

    <!-- Scripts -> Managed Servers -->
    <path d="M 500 610 L 360 700" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrowPurple)" />
    <path d="M 700 610 L 840 700" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrowPurple)" />
    <text x="600" y="660" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">WoL / IPMI / iLO / Proxmox API</text>

    <!-- Servers -> Healthchecks -->
    <path d="M 575 750 L 950 180" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,8" fill="none" marker-end="url(#arrowGreen)" />
    <path d="M 1050 700 L 1050 220" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,8" fill="none" marker-end="url(#arrowGreen)" />
    <text x="1060" y="450" font-family="Arial, sans-serif" font-size="14" fill="#16a34a" font-weight="bold" transform="rotate(-90, 1060, 450)">HTTPS Pings</text>

    <!-- Scripts -> Healthchecks -->
    <path d="M 800 540 L 1000 220" stroke="#2563eb" stroke-width="3" stroke-dasharray="8,8" fill="none" marker-end="url(#arrowBlue)" />
    <text x="920" y="350" font-family="Arial, sans-serif" font-size="14" fill="#2563eb" font-weight="bold">API v3 (Pull)</text>
  </g>

  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Legend -->
  <text x="50" y="880" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Architecture v2.0 - Dec 2025</text>
</svg>
