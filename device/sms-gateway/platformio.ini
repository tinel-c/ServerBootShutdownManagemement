; PlatformIO Project Configuration File
; SMS Gateway for ESP32 with SIM800
; Integrated with ServerBootShutdownManagement project

[env:lilygo-t-call]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_port = COM3
lib_deps = 
    vshymanskyy/TinyGSM@^0.11.7
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
    ; sparkfun/SparkFun_BME280_Arduino_Library@^1.2.1  ; Optional: Uncomment if using BME280 sensor
    bakercp/CRC32@^2.0.1
    ArduinoHttpClient@^0.4.0
    ArduinoOTA@^1.0.0

build_flags = 
    -DTINY_GSM_MODEM_SIM800
    -DTINY_GSM_RX_BUFFER=1024
    -DTINY_GSM_USE_GPRS=true
    -DTINY_GSM_USE_WIFI=false

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    vshymanskyy/TinyGSM@^0.11.7
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
    ; sparkfun/SparkFun_BME280_Arduino_Library@^1.2.1  ; Optional: Uncomment if using BME280 sensor
    bakercp/CRC32@^2.0.1
    ArduinoHttpClient@^0.4.0
    ArduinoOTA@^1.0.0

build_flags = 
    -DTINY_GSM_MODEM_SIM800
    -DTINY_GSM_RX_BUFFER=1024
    -DTINY_GSM_USE_GPRS=true
    -DTINY_GSM_USE_WIFI=false
