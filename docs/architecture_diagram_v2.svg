<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000">
  <defs>
    <!-- Soft Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="3" dy="3" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="autoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L7,4 z" fill="#3b82f6" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L7,4 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L7,4 z" fill="#10b981" />
    </marker>
    <marker id="arrowSlate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L7,4 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1000" fill="#f8fafc" />

  <!-- Title -->
  <text x="600" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1e293b" text-anchor="middle">
    System Architecture & Interaction Flow
  </text>

  <!-- 1. TOP LAYER: EXTERNAL -->
  <!-- END USER -->
  <g filter="url(#shadow)">
    <rect x="150" y="100" width="280" height="100" rx="16" fill="white" stroke="#3b82f6" stroke-width="2" />
    <text x="290" y="145" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">👤 END USER</text>
    <text x="290" y="170" font-family="Segoe UI, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Web Dashboard Access</text>
  </g>

  <!-- HEALTHCHECKS.IO -->
  <g filter="url(#shadow)">
    <rect x="770" y="100" width="280" height="100" rx="16" fill="white" stroke="#10b981" stroke-width="2" />
    <image href="https://healthchecks.io/static/img/logo.png" x="835" y="110" width="150" height="50" />
    <text x="910" y="180" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">Healthchecks.io</text>
  </g>

  <!-- 2. MIDDLE LAYER: AUTOMATION SERVER -->
  <g filter="url(#shadow)">
    <rect x="100" y="280" width="1000" height="380" rx="32" fill="url(#autoGrad)" stroke="#3b82f6" stroke-width="3" />
    <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Logo-ubuntu_cof-orange-hex.svg/200px-Logo-ubuntu_cof-orange-hex.svg.png" x="125" y="300" width="50" height="50" />
    <text x="600" y="325" font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AUTOMATION SERVER (Ubuntu VM)</text>
    
    <!-- Node-RED -->
    <rect x="150" y="380" width="240" height="120" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <image href="https://nodered.org/favicon.ico" x="240" y="395" width="60" height="60" />
    <text x="270" y="475" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#991b1b" text-anchor="middle">Node-RED</text>
    
    <!-- Mosquitto -->
    <rect x="810" y="380" width="240" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <image href="https://mosquitto.org/images/mosquitto-text-side.png" x="830" y="395" width="200" height="60" />
    <text x="930" y="475" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Mosquitto MQTT</text>
    
    <!-- Python Management Scripts -->
    <rect x="350" y="530" width="500" height="100" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
    <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Python-logo-notext.svg/200px-Python-logo-notext.svg.png" x="375" y="550" width="60" height="60" />
    <text x="625" y="585" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#581c87" text-anchor="middle">Python Management Scripts</text>
    <text x="625" y="610" font-family="Segoe UI, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle">listeners • publishers • health_monitor</text>
  </g>

  <!-- 3. BOTTOM LAYER: INFRASTRUCTURE -->
  <!-- Dell -->
  <g filter="url(#shadow)">
    <rect x="100" y="750" width="450" height="180" rx="24" fill="#f0fdf4" stroke="#10b981" stroke-width="3" />
    <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Dell_logo_2016.svg/200px-Dell_logo_2016.svg.png" x="125" y="780" width="80" height="80" />
    <text x="355" y="795" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#064e3b" text-anchor="middle">Dell PowerEdge T310</text>
    <text x="355" y="820" font-family="Segoe UI, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Proxmox Hypervisor</text>
    <image href="https://www.proxmox.com/images/proxmox/proxmox-logo-color-stacked.png" x="300" y="840" width="110" height="40" />
    <text x="355" y="905" font-family="Segoe UI, sans-serif" font-size="12" fill="#10b981" font-weight="bold" text-anchor="middle">Wake-on-LAN Support</text>
  </g>

  <!-- HP -->
  <g filter="url(#shadow)">
    <rect x="650" y="750" width="450" height="180" rx="24" fill="#fffaf5" stroke="#f97316" stroke-width="3" />
    <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/HP_logo_2012.svg/200px-HP_logo_2012.svg.png" x="675" y="780" width="80" height="80" />
    <text x="905" y="795" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#7c2d12" text-anchor="middle">HP ProLiant DL360p</text>
    <text x="905" y="820" font-family="Segoe UI, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Proxmox Hypervisor</text>
    <image href="https://www.proxmox.com/images/proxmox/proxmox-logo-color-stacked.png" x="850" y="840" width="110" height="40" />
    <text x="905" y="905" font-family="Segoe UI, sans-serif" font-size="12" fill="#ea580c" font-weight="bold" text-anchor="middle">iLO Management Support</text>
  </g>

  <!-- 4. BEAUTIFUL FLOW TRACING (CURVED) -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    
    <!-- User -> Node-RED (HTTP) -->
    <path d="M 290 200 Q 290 290 270 380" stroke="#3b82f6" marker-end="url(#arrowBlue)" />
    <text x="220" y="260" font-family="Segoe UI, sans-serif" font-size="14" fill="#3b82f6" font-weight="bold">HTTP/HTTPS</text>

    <!-- Node-RED <-> Mosquitto (MQTT) -->
    <path d="M 390 410 Q 600 370 810 410" stroke="#3b82f6" marker-end="url(#arrowBlue)" />
    <path d="M 810 470 Q 600 510 390 470" stroke="#3b82f6" marker-end="url(#arrowBlue)" />
    <text x="600" y="445" font-family="Segoe UI, sans-serif" font-size="14" fill="#3b82f6" font-weight="bold" text-anchor="middle">MQTT Commands &amp; Status</text>

    <!-- Mosquitto <-> Python Scripts (MQTT) -->
    <path d="M 930 500 Q 930 580 850 580" stroke="#8b5cf6" marker-end="url(#arrowPurple)" />
    <text x="940" y="550" font-family="Segoe UI, sans-serif" font-size="14" fill="#8b5cf6" font-weight="bold">Pub/Sub</text>

    <!-- Python Scripts -> Servers (Control) -->
    <path d="M 450 630 Q 450 700 350 750" stroke="#8b5cf6" marker-end="url(#arrowPurple)" />
    <path d="M 800 630 Q 800 700 900 750" stroke="#8b5cf6" marker-end="url(#arrowPurple)" />
    <text x="625" y="710" font-family="Segoe UI, sans-serif" font-size="14" fill="#8b5cf6" font-weight="bold" text-anchor="middle">WoL / IPMI / iLO / Proxmox API</text>

    <!-- Servers -> Healthchecks (HTTPS Pings) -->
    <path d="M 550 840 Q 750 840 910 200" stroke="#10b981" stroke-dasharray="8,8" marker-end="url(#arrowGreen)" />
    <path d="M 1100 840 Q 1150 840 1150 400 Q 1150 150 1050 150" stroke="#10b981" stroke-dasharray="8,8" marker-end="url(#arrowGreen)" />
    <text x="1100" y="600" font-family="Segoe UI, sans-serif" font-size="14" fill="#10b981" font-weight="bold" transform="rotate(-90, 1100, 600)">HTTPS Pings</text>

    <!-- Python Scripts -> Healthchecks (API) -->
    <path d="M 625 530 Q 625 450 750 250 Q 800 150 770 150" stroke="#3b82f6" stroke-dasharray="8,8" marker-end="url(#arrowBlue)" />
    <text x="640" y="240" font-family="Segoe UI, sans-serif" font-size="14" fill="#3b82f6" font-weight="bold">API v3 Pull</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 960)">
    <rect width="1100" height="30" rx="8" fill="#f1f5f9" />
    <text x="550" y="20" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      Tracing Guide: Solid Blue = User Interactions • Solid Purple = Backend Logic • Dashed Green = External Telemetry • Dashed Blue = API Sync
    </text>
  </g>
</svg>
