mqtt:
  broker:
    host: "${MQTT_BROKER_HOST}"  # From environment variable
    port: "${MQTT_BROKER_PORT}"  # From environment variable
    keepalive: 60
  
  authentication:
    username: "${MQTT_USERNAME}"  # From environment variable
    password: "${MQTT_PASSWORD}"  # From environment variable
  
  tls:
    enabled: false
    ca_certs: "/path/to/ca.crt"
    certfile: "/path/to/client.crt"
    keyfile: "/path/to/client.key"
  
  topics:
    command_boot: "dell/t310/command/boot"
    command_shutdown: "dell/t310/command/shutdown"
    command_status: "dell/t310/command/status"
    status: "dell/t310/status"
    logs: "dell/t310/logs"
    response: "dell/t310/response"
    
    # Client PC topics
    client_presence: "clients/+/presence"
    client_heartbeat: "clients/+/heartbeat"
    automation_status: "automation/clients/status"
    
    # SMS Gateway topics (domain: 500-599)
    sms_command_send: "sms/gateway/command/send"
    sms_status: "sms/gateway/status"
    sms_status_timestamp: "sms/gateway/status/timestamp"
    sms_receive_from: "sms/gateway/receive/from"
    sms_receive_text: "sms/gateway/receive/text"
    sms_receive_timestamp: "sms/gateway/receive/timestamp"
    sms_send_response: "sms/gateway/send/response"
    sms_send_timestamp: "sms/gateway/send/timestamp"
    sms_ota_command: "sms/gateway/command/ota"
    sms_ota_status: "sms/gateway/ota/status"
    sms_ota_progress: "sms/gateway/ota/progress"
  
  qos: 1
  retain: false
