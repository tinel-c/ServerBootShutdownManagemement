# Repo firmware devices watched by scripts/status/device_fleet.py.
# status_topic: any message means the device is live.
# expected: false excludes from the Windows client "should be online" count (default true).
# flash: true is the default for every new ESP device (post-build fleet OTA).
# Set false only when that firmware cannot accept ArduinoOTA yet.
# Keep client/config/device_fleet.yaml in sync for Program Files installs.

broker:
  host: "192.168.2.4"
  port: 1883

devices:
  - id: PlatformIO_esp32-4ch-thyristor-board-illumination
    path: device/PlatformIO_esp32-4ch-thyristor-board-illumination
    status_topic: illumination/4ch-thyristor/status
    timeout_sec: 90
    flash: true
    pio_env: esp32dev
    ota_port: 3232

  - id: PlatformIO_esp32-sms-gateway
    path: device/PlatformIO_esp32-sms-gateway
    status_topic: sms/gateway/status
    timeout_sec: 180
    flash: true
    pio_env: lilygo-t-call
    ota_port: 3232

  - id: PlatformIO_ESP8266_Main_Entry
    path: device/PlatformIO_ESP8266_Main_Entry
    status_topic: gate/main/status
    timeout_sec: 90
    # Stay false until firmware 1.0.0 is on the board. The previous image has no OTA listener.
    flash: false
    pio_env: esp12e
    ota_port: 8266
