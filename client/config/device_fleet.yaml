# Offline fallback for Windows ClientMonitor.
# The client fetches scripts/status/device_fleet.yaml and device/tasmota/catalog.yaml
# from GitHub. This file is used only when that fetch fails and no cache exists.
# status_topic: any message means the device is live.
# expected: false excludes a device from the "should be online" count (default true).
# flash: true is the default for every new ESP device (post-build fleet OTA).
# The client UI can still Upload when online+IP even if flash is false.

broker:
  host: "192.168.2.4"
  port: 1883

devices:
  - id: PlatformIO_esp32-4ch-thyristor-board-illumination
    path: device/PlatformIO_esp32-4ch-thyristor-board-illumination
    status_topic: illumination/4ch-thyristor/status
    timeout_sec: 90
    flash: true
    pio_env: esp32dev
    ota_port: 3232

  - id: PlatformIO_esp32-sms-gateway
    path: device/PlatformIO_esp32-sms-gateway
    status_topic: sms/gateway/status
    timeout_sec: 180
    flash: true
    pio_env: lilygo-t-call
    ota_port: 3232

  - id: PlatformIO_ESP8266_Main_Entry
    path: device/PlatformIO_ESP8266_Main_Entry
    status_topic: gate/main/status
    timeout_sec: 90
    # 1.0.1 is on the board and answered ArduinoOTA on UDP 8266.
    flash: true
    pio_env: esp12e
    ota_port: 8266
