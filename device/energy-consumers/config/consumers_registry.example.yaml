# Energy consumers registry
# Copy to consumers_registry.yaml and edit.
#
# Each consumer must have a matching folder under devices/<id>/ (optional until publisher exists).

version: 1

consumers:
  - id: example-basement-plug
    name: Example basement smart plug
    type: tuya_plug
    enabled: false
    mqtt_prefix: energy/consumers/example-basement-plug
    device_path: devices/example-basement-plug
    poll_interval_s: 30
    tags:
      - basement
      - discretionary
    notes: Copy devices/_template and set Tuya device id from tuya_devices.json

  - id: example-workshop-meter
    name: Example workshop sub-meter
    type: shelly_em
    enabled: false
    mqtt_prefix: energy/consumers/example-workshop-meter
    device_path: devices/example-workshop-meter
    poll_interval_s: 15
    tags:
      - workshop
    notes: Shelly HTTP API or native MQTT

  - id: example-garden-power-hut
    name: Example garden hut Tasmota meter
    type: tasmota_meter
    enabled: false
    mqtt_prefix: energy/consumers/example-garden-power-hut
    device_path: devices/garden-power-hut
    poll_interval_s: 30
    stale_after_s: 660
    tags: [tasmota, sonoff, garden]
    controls:
      switch: true
    ui:
      order: 6
      accent: "#f59e0b"
    tasmota_topic: sonoffPower320D_afara
    tasmota_power_key: POWER
    tasmota_command_key: Power
